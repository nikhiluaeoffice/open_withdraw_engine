<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#goldGradient)" stroke="#78350F" stroke-width="2.5" filter="url(#shadow)" />
  
  <!-- Outer Ring Shadow Accent -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="#FEF3C7" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Wallet Body -->
  <rect x="26" y="32" width="48" height="36" rx="7" ry="7" fill="none" stroke="#18181B" stroke-width="5" stroke-linejoin="round" />

  <!-- Inner Top Fold Line -->
  <path d="M 26 40 L 74 40" stroke="#18181B" stroke-width="3" stroke-linecap="round" />

  <!-- Wallet Lock Clasp -->
  <rect x="58" y="44" width="16" height="13" rx="3.5" ry="3.5" fill="#FBBF24" stroke="#18181B" stroke-width="4.5" />
  <!-- Clasp Inner Dot -->
  <circle cx="63" cy="50.5" r="1.5" fill="#18181B" />
</svg>
